<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep language-specific, symbol, emoji and monospace fallback intact. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Atkinson Hyperlegible</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Atkinson Hyperlegible</family></prefer>
  </alias>
  <!-- Prefer proportional digits in native Fontconfig/Pango consumers as well. -->
  <match target="font">
    <edit name="fontfeatures" mode="append">
      <string>tnum=0</string>
      <string>pnum=1</string>
    </edit>
  </match>
</fontconfig>
