# Desktop dialogs are implemented by DaisyOS. Disable implicit GTK/KDE fallback.
# DaisyOS does not expose a Secret portal until it has a native credential
# provider; routing it to KWallet would leak KDE setup/unlock dialogs.
[preferred]
default=none
org.freedesktop.impl.portal.Access=daisyos
org.freedesktop.impl.portal.FileChooser=daisyos
org.freedesktop.impl.portal.Account=daisyos
org.freedesktop.impl.portal.AppChooser=daisyos
org.freedesktop.impl.portal.ScreenCast=daisyos
org.freedesktop.impl.portal.RemoteDesktop=daisyos
org.freedesktop.impl.portal.Screenshot=daisyos
org.freedesktop.impl.portal.Print=daisyos
org.freedesktop.impl.portal.Settings=daisyos
org.freedesktop.impl.portal.Notification=daisyos
org.freedesktop.impl.portal.Background=daisyos
org.freedesktop.impl.portal.Wallpaper=daisyos
org.freedesktop.impl.portal.DynamicLauncher=daisyos
org.freedesktop.impl.portal.Usb=daisyos
org.freedesktop.impl.portal.GlobalShortcuts=daisyos
org.freedesktop.impl.portal.InputCapture=daisyos
org.freedesktop.impl.portal.Lockdown=daisyos
