syntax = "proto3";
package daisyos.continuity.v1;
option csharp_namespace = "DaisyOS.Continuity.Protocol.V1";

// Versioned Continuity contract. Bootstrap carries only a public certificate
// before TLS; every Envelope is carried inside mutually authenticated TLS.
message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  bytes request_id = 3; // exactly 16 random bytes
  oneof message {
    Hello hello = 10;
    Ping ping = 11;
    Pong pong = 12;
    PairConsent pair_consent = 13;
    ClipboardOffer clipboard_offer = 20;
    ClipboardGet clipboard_get = 21;
    ClipboardData clipboard_data = 22;
    FileOffer file_offer = 30;
    FileDecision file_decision = 31;
    FileChunk file_chunk = 32;
    FileComplete file_complete = 33;
    FileCancel file_cancel = 34;
    Error error = 40;
    LiveStart live_start = 50;
    LiveDecision live_decision = 51;
    LivePacket live_packet = 52;
    ActivityOffer activity_offer = 60;
    ActivityResult activity_result = 61;
  }
  reserved 4 to 9, 14 to 19, 23 to 29, 35 to 39;
}
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  TEXT_CLIPBOARD = 1;
  FILES = 2;
  INPUT = 3;
  HANDOFF = 4;
  SCREEN = 5;
  AUDIO = 6;
  EDGE_INPUT = 7;
}
message Hello {
  bytes device_id = 1; // 32 bytes; must match verified transport identity
  repeated Capability capabilities = 2;
  bytes nonce = 3; // 32 fresh random bytes
  bool trusted = 4; // whether this identity is still paired locally
}
message Ping { uint64 sequence = 1; }
message Pong { uint64 sequence = 1; }
message ClipboardOffer {
  bytes update_id = 1;
  bytes origin_peer_id = 2;
  repeated string mime_types = 3;
  uint64 size = 4;
  bytes sha256 = 5;
}
message ClipboardGet { bytes update_id = 1; string mime_type = 2; }
message ClipboardData { bytes update_id = 1; string mime_type = 2; bytes data = 3; }
message FileOffer {
  bytes transfer_id = 1;
  string display_name = 2; // one basename, never a destination path
  uint64 length = 3;
  bytes sha256 = 4;
  string mime_hint = 5;
}
message FileDecision {
  bytes transfer_id = 1;
  bool accepted = 2;
  uint64 resume_offset = 3; // only with matching authenticated persisted manifest
}
message FileChunk { bytes transfer_id = 1; uint64 offset = 2; bytes data = 3; }
message FileComplete { bytes transfer_id = 1; bytes verified_sha256 = 2; }
message FileCancel { bytes transfer_id = 1; }
message Error {
  enum Code {
    UNSPECIFIED = 0;
    INCOMPATIBLE_VERSION = 1;
    UNAUTHORIZED = 2;
    INVALID_MESSAGE = 3;
    LIMIT_EXCEEDED = 4;
    CANCELLED = 5;
    UNAVAILABLE = 6;
    CHECKSUM_MISMATCH = 7;
  }
  Code code = 1;
  string safe_description = 2;
}

// Public bootstrap only; never grants trust. Certificates are validated by the
// platform TLS chain engine; pairing uses SRP-6a with a one-time six-digit code bound to both identities.
message Bootstrap { uint32 major = 1; bytes certificate = 2; string name = 3; bool pairing = 4; uint32 port = 5; }
message PairConsent { bool approved = 1; bytes salt = 2; bytes public_value = 3; bytes proof = 4; }

// One bounded, independently cancellable TLS connection per live session.
message LiveStart { string session_id = 1; string kind = 2; bool control = 3; }
message LiveDecision { bool accepted = 1; }
message LivePacket { uint64 sequence = 1; bytes data = 2; }
// Allowlisted native activity, never a command, executable or local file path.
message ActivityOffer { string app_id = 1; string kind = 2; uint32 schema_version = 3; string title = 4; string text = 5; }
message ActivityResult { bool accepted = 1; }
