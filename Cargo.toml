[workspace]
resolver = "2"
members = ["crates/daisy-core", "crates/daisy-ui", "crates/daisy-platform", "apps/calculator", "apps/daisy-ui-gallery"]
# Existing shipping daemons retain their own release and no_std profiles.
exclude = ["services/DaisyLaunch/rust", "src/native/daisy_background", "src/native/daisy_desktop_services"]

[workspace.package]
edition = "2021"
rust-version = "1.92"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-wayland", "renderer-software", "accessibility", "compat-1-18", "unstable-winit-030"] }
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
