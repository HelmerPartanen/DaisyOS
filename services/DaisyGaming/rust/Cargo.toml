[package]
name = "daisy-gamingd"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros", "process", "time", "sync", "signal", "io-util", "net"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
